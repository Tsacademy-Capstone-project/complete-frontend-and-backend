openapi: 3.0.3
info:
  title: Complaint Management Portal API
  version: 1.0.0
  description: >-
    API for account management and complaint submission, assignment, tracking,
    comments, and resolution. Protected routes require a bearer JWT. Role access
    is stated per operation. The API allows 100 requests per 15 minutes per IP;
    authentication routes allow 10 requests per 15 minutes per IP.
servers:
  - url: /
    description: Current host

tags:
  - name: System
  - name: Authentication
  - name: User
  - name: Complaints
  - name: Comments
  - name: Handler
  - name: Admin

security:
  - bearerAuth: []

paths:
  /:
    get:
      tags: [System]
      summary: API status
      security: []
      responses:
        "200":
          description: API is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Complaint Management Portal API is running
  /api/health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        "200":
          description: API health status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      description: >-
        Public endpoint. Username is trimmed and lowercased, must be 2-20
        characters, and must be unique. Password must be 6-20 characters.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              firstName: Alex
              lastName: Morgan
              userName: alexm
              email: alex@example.com
              password: securePass123
      responses:
        "201":
          description: Registration succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/auth/register-admin:
    post:
      tags: [Authentication]
      summary: Register an administrator using a private signup code
      description: >-
        Requires the signupCode configured in ADMIN_SIGNUP_CODE on the server.
        Admin signup is disabled when this setting is empty. The server assigns
        the ADMIN role; the request cannot choose a role. Passwords must be 8-20 characters.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRegisterRequest"
      responses:
        "201":
          description: Administrator registered; use the returned JWT to sign in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Admin signup is not configured on the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      description: >-
        Public endpoint. Supply either email or userName as the identifier.
        The existing email field is also accepted with a username value.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              email:
                value:
                  email: alex@example.com
                  password: securePass123
              userName:
                value:
                  userName: alexm
                  password: securePass123
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get the current user
      description: Requires a valid bearer token.
      responses:
        "200":
          description: Authenticated user details.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/user/dashboard:
    get:
      tags: [User]
      summary: Get the user dashboard
      description: Requires a bearer token with the USER role.
      responses:
        "200":
          description: User complaint summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  statistics:
                    $ref: "#/components/schemas/UserStatistics"
                  complaintsByCategory:
                    type: array
                    description: The current controller returns recent complaint documents in this field.
                    items:
                      $ref: "#/components/schemas/Complaint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/complaints:
    post:
      tags: [Complaints]
      summary: Submit a complaint
      description: Requires a bearer token with the USER role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComplaintRequest"
            example:
              title: Unable to access my account
              description: The password reset link returns an error.
              category: ACCOUNT
              priority: MEDIUM
      responses:
        "201":
          description: Complaint created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/complaints/my:
    get:
      tags: [Complaints]
      summary: List the current user's complaints
      description: Requires a bearer token with the USER role. Results are newest first.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/UserLimit"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/PriorityFilter"
      responses:
        "200":
          description: Complaint list and pagination metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserComplaintListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/complaints/{id}:
    parameters:
      - $ref: "#/components/parameters/ComplaintId"
    get:
      tags: [Complaints]
      summary: Get one of the current user's complaints
      description: Requires a bearer token with the USER role. `id` is the public complaintId, not the MongoDB document ID.
      responses:
        "200":
          description: Complaint details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/complaints/{id}/close:
    parameters:
      - $ref: "#/components/parameters/ComplaintId"
    patch:
      tags: [Complaints]
      summary: Close a resolved complaint
      description: Requires a bearer token with the USER role. Only RESOLVED complaints can be closed.
      responses:
        "200":
          description: Complaint closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/complaints/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/MongoComplaintId"
    get:
      tags: [Comments]
      summary: List complaint comments
      description: >-
        Requires a bearer token. Only the complaint owner, its assigned handler,
        or an ADMIN can view comments. `id` is the MongoDB complaint `_id`.
      responses:
        "200":
          description: Comments in chronological order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Comments]
      summary: Add a comment to a complaint
      description: >-
        Requires a bearer token. Only the complaint owner, its assigned handler,
        or an ADMIN can comment. `id` is the MongoDB complaint `_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
            example:
              message: I have attached the requested information.
      responses:
        "201":
          description: Comment created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/handler/dashboard:
    get:
      tags: [Handler]
      summary: Get the handler dashboard
      description: Requires a bearer token with the HANDLER role.
      responses:
        "200":
          description: Handler statistics and assigned complaints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  statistics:
                    type: object
                    properties:
                      totalAssigned: { type: integer }
                      assigned: { type: integer }
                      inProgress: { type: integer }
                      resolved: { type: integer }
                  recentAssignments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Complaint"
                  urgentComplaints:
                    type: array
                    items:
                      $ref: "#/components/schemas/Complaint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/handler/complaints:
    get:
      tags: [Handler]
      summary: List complaints assigned to the current handler
      description: Requires a bearer token with the HANDLER role.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/UserLimit"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/PriorityFilter"
      responses:
        "200":
          description: Assigned complaint list and pagination metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandlerComplaintListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/handler/complaints/{id}:
    parameters:
      - $ref: "#/components/parameters/ComplaintId"
    get:
      tags: [Handler]
      summary: Get an assigned complaint
      description: Requires a bearer token with the HANDLER role. `id` is the public complaintId.
      responses:
        "200":
          description: Complaint details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/handler/complaints/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ComplaintId"
    patch:
      tags: [Handler]
      summary: Mark an assigned complaint in progress
      description: Requires a bearer token with the HANDLER role. Only the literal status IN_PROGRESS is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [IN_PROGRESS]
            example:
              status: IN_PROGRESS
      responses:
        "200":
          description: Complaint status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/handler/complaints/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/ComplaintId"
    patch:
      tags: [Handler]
      summary: Resolve a complaint
      description: Requires a bearer token with the HANDLER role. The complaint must be IN_PROGRESS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution:
                  type: string
                  minLength: 1
            example:
              resolution: Reset the account credentials and confirmed access with the customer.
      responses:
        "200":
          description: Complaint resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/admin/dashboard:
    get:
      tags: [Admin]
      summary: Get the admin dashboard
      description: Requires a bearer token with the ADMIN role.
      responses:
        "200":
          description: Overall complaint statistics and workload summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statistics:
                    $ref: "#/components/schemas/AdminStatistics"
                  overdueComplaints:
                    type: array
                    items:
                      $ref: "#/components/schemas/Complaint"
                  complaintsByCategory:
                    type: array
                    items:
                      $ref: "#/components/schemas/CountByKey"
                  complaintsByPriority:
                    type: array
                    items:
                      $ref: "#/components/schemas/CountByKey"
                  handlerWorkload:
                    type: array
                    items:
                      type: object
                  recentComplaints:
                    type: array
                    items:
                      $ref: "#/components/schemas/Complaint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/admin/complaints:
    get:
      tags: [Admin]
      summary: List and filter complaints
      description: Requires a bearer token with the ADMIN role. Results are paginated.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/AdminLimit"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/PriorityFilter"
        - name: search
          in: query
          description: Case-insensitive search across complaint ID, title, and description.
          schema:
            type: string
        - name: assignedTo
          in: query
          description: MongoDB user ID of the assigned handler.
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            default: createdAt
            example: priority
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Complaint list and pagination metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComplaintListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/admin/complaints/{id}:
    parameters:
      - $ref: "#/components/parameters/ComplaintId"
    get:
      tags: [Admin]
      summary: Get a complaint
      description: Requires a bearer token with the ADMIN role. `id` is the public complaintId.
      responses:
        "200":
          description: Complaint details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/admin/complaints/{id}/assign:
    parameters:
      - $ref: "#/components/parameters/ComplaintId"
    patch:
      tags: [Admin]
      summary: Assign a complaint to a handler
      description: Requires a bearer token with the ADMIN role. Only PENDING complaints can be assigned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handlerId]
              properties:
                handlerId:
                  type: string
                  description: MongoDB user ID of a user whose role is HANDLER.
            example:
              handlerId: 66fd1234567890abcdef1234
      responses:
        "200":
          description: Complaint assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/admin/complaints/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/ComplaintId"
    patch:
      tags: [Admin]
      summary: Resolve an active complaint as an administrator
      description: >-
        Requires ADMIN. Accepts PENDING, ASSIGNED, or IN_PROGRESS complaints.
        Records the resolution, timestamp, and administrator in status history.
        Resolved, rejected, and closed complaints cannot be resolved again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Complaint resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/admin/complaints/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/ComplaintId"
    patch:
      tags: [Admin]
      summary: Reject a pending complaint
      description: Requires a bearer token with the ADMIN role. Only PENDING complaints can be rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
            example:
              reason: The request is outside the services supported by this portal.
      responses:
        "200":
          description: Complaint rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the JWT returned by register or login. Swagger UI adds the Bearer prefix.
  parameters:
    ComplaintId:
      name: id
      in: path
      required: true
      description: Public complaint ID (not the MongoDB document ID).
      schema:
        type: string
      example: CMP-2026-0001
    MongoComplaintId:
      name: id
      in: path
      required: true
      description: MongoDB complaint document `_id` (used by comment endpoints).
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
      example: 66fd1234567890abcdef1234
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    UserLimit:
      name: limit
      in: query
      description: Page size, clamped to 1-50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    AdminLimit:
      name: limit
      in: query
      description: Page size, clamped to 1-100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    StatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/ComplaintStatus"
    CategoryFilter:
      name: category
      in: query
      schema:
        $ref: "#/components/schemas/ComplaintCategory"
    PriorityFilter:
      name: priority
      in: query
      schema:
        $ref: "#/components/schemas/ComplaintPriority"
  responses:
    BadRequest:
      description: Invalid request data or invalid state transition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing/invalid/expired token or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Account is inactive, role is insufficient, or access to this complaint is denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested user or complaint was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Email or username is already registered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: General or authentication rate limit exceeded.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Too many requests. Please try again later.
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RegisterRequest:
      type: object
      required: [firstName, lastName, userName, email, password]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        userName:
          type: string
          minLength: 2
          maxLength: 20
          description: Unique; trimmed and stored lowercase.
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 20
    AdminRegisterRequest:
      allOf:
        - $ref: "#/components/schemas/RegisterRequest"
        - type: object
          required: [signupCode]
          properties:
            password:
              type: string
              format: password
              minLength: 8
              maxLength: 20
            signupCode:
              type: string
              format: password
              minLength: 1
              description: Private admin signup code supplied by the system administrator.
    LoginRequest:
      type: object
      required: [password]
      description: Provide exactly one of email or userName as the login identifier.
      properties:
        email:
          type: string
          description: Accepts an email address or a username for backward compatibility.
        userName:
          type: string
        password:
          type: string
          format: password
      oneOf:
        - required: [email]
        - required: [userName]
    AuthResponse:
      type: object
      required: [message, token, user]
      properties:
        message:
          type: string
        token:
          type: string
          description: JWT bearer token.
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        _id:
          type: string
          example: 66fd1234567890abcdef1234
        firstName:
          type: string
        lastName:
          type: string
        userName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [USER, HANDLER, ADMIN]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ComplaintCategory:
      type: string
      enum: [PAYMENT, ACCOUNT, TECHNICAL, SERVICE, OTHER]
    ComplaintPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
    ComplaintStatus:
      type: string
      enum: [PENDING, ASSIGNED, IN_PROGRESS, RESOLVED, REJECTED, CLOSED]
    CreateComplaintRequest:
      type: object
      required: [title, description, category, priority]
      properties:
        title:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/ComplaintCategory"
        priority:
          $ref: "#/components/schemas/ComplaintPriority"
    Complaint:
      type: object
      properties:
        _id:
          type: string
        complaintId:
          type: string
          example: CMP-2026-0001
        title:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/ComplaintCategory"
        priority:
          $ref: "#/components/schemas/ComplaintPriority"
        status:
          $ref: "#/components/schemas/ComplaintStatus"
        submittedBy:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/User"
        assignedTo:
          nullable: true
          oneOf:
            - type: string
            - $ref: "#/components/schemas/User"
        assignedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        resolution:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        statusHistory:
          type: array
          items:
            type: object
            properties:
              status:
                $ref: "#/components/schemas/ComplaintStatus"
              changedBy:
                type: string
              note:
                type: string
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ComplaintResponse:
      type: object
      properties:
        complaint:
          $ref: "#/components/schemas/Complaint"
    ComplaintMutationResponse:
      type: object
      properties:
        message:
          type: string
        complaint:
          $ref: "#/components/schemas/Complaint"
    Comment:
      type: object
      properties:
        _id:
          type: string
        complaint:
          type: string
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
          maxLength: 5000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
    UserComplaintListResponse:
      type: object
      properties:
        complaints:
          type: array
          items:
            $ref: "#/components/schemas/Complaint"
        pagination:
          $ref: "#/components/schemas/Pagination"
    HandlerComplaintListResponse:
      $ref: "#/components/schemas/UserComplaintListResponse"
    AdminComplaintListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Complaint"
        pagination:
          $ref: "#/components/schemas/Pagination"
    UserStatistics:
      type: object
      properties:
        total: { type: integer }
        pending: { type: integer }
        assigned: { type: integer }
        inProgress: { type: integer }
        resolved: { type: integer }
        rejected: { type: integer }
        closed: { type: integer }
    AdminStatistics:
      allOf:
        - $ref: "#/components/schemas/UserStatistics"
    CountByKey:
      type: object
      properties:
        _id:
          type: string
        count:
          type: integer
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
